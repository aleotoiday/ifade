mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
udp: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
secret: ""

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  respect-rules: true
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'

  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8

  nameserver:
    - https://dns.cloudflare.com/dns-query
    - tls://1.1.1.1:853
    - tls://8.8.8.8:853

  fallback:
    - tls://8.8.8.8:853

  fallback-filter:
    geoip: true
    geoip-code: VN

proxy-providers:
  Provider:
    type: http
    url: "Dán Sub Vào Đây"
    interval: 43200
    path: ./providers/provider.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 900

proxy-groups:
  - name: 🦖 Oi Oi Oi
    type: select
    proxies:
      - 🚀 Auto
      - 📡 Full Server
      - 🇻🇳 Việt Nam
      - 🇸🇬 Singapore
      - 🇭🇰 Hong Kong
      - 🇯🇵 Nhật Bản
      - 🇺🇸 Hoa Kỳ
      - DIRECT

  - name: 📡 Full Server
    type: select
    use:
      - Provider

  - name: 🚀 Auto
    type: url-test
    use:
      - Provider
    url: http://www.gstatic.com/generate_204
    interval: 900
    tolerance: 50

  - name: 🇻🇳 Việt Nam
    type: url-test
    use:
      - Provider
    filter: "(?i)(VN|Vietnam|Viettel|VNPT|FPT|HCM|Ha Noi|Da Nang)"
    url: http://www.gstatic.com/generate_204
    interval: 900
    tolerance: 50

  - name: 🇸🇬 Singapore
    type: url-test
    use:
      - Provider
    filter: "(?i)(SG|Singapore)"
    url: http://www.gstatic.com/generate_204
    interval: 900
    tolerance: 50

  - name: 🇭🇰 Hong Kong
    type: url-test
    use:
      - Provider
    filter: "(?i)(HK|Hong Kong)"
    url: http://www.gstatic.com/generate_204
    interval: 900
    tolerance: 50

  - name: 🇯🇵 Nhật Bản
    type: url-test
    use:
      - Provider
    filter: "(?i)(JP|Japan|Tokyo|Osaka)"
    url: http://www.gstatic.com/generate_204
    interval: 900
    tolerance: 50

  - name: 🇺🇸 Hoa Kỳ
    type: url-test
    use:
      - Provider
    filter: "(?i)(US|USA|United States|America)"
    url: http://www.gstatic.com/generate_204
    interval: 900
    tolerance: 50

rule-providers:
  ads:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt
    path: ./providers/ads.yaml
    interval: 86400

  direct:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
    path: ./providers/direct.yaml
    interval: 86400

  proxy:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
    path: ./providers/proxy.yaml
    interval: 86400

rules:
  - RULE-SET,ads,REJECT
  - RULE-SET,direct,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,VN,DIRECT
  - RULE-SET,proxy,🦖 Oi Oi Oi
  - MATCH,🦖 Oi Oi Oi
