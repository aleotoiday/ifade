<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ifade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Mali', cursive, sans-serif;
      overflow: hidden;
    }

    .glow-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fade-text {
      font-size: clamp(5rem, 20vw, 12rem);
      font-weight: 500;
      font-style: italic;
      letter-spacing: 0.04em;
      color: #ffffff;
      text-transform: lowercase;
      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.9),
        0 0 25px rgba(255, 255, 255, 0.8),
        0 0 50px rgba(220, 220, 255, 0.7),
        0 0 80px rgba(180, 180, 255, 0.6),
        0 0 120px rgba(140, 140, 255, 0.5),
        0 0 180px rgba(100, 100, 255, 0.4);
      animation: softPulse 3s infinite ease-in-out;
      user-select: none;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
    }

    @keyframes softPulse {
      0% {
        text-shadow:
          0 0 8px rgba(255, 255, 255, 0.85),
          0 0 20px rgba(255, 255, 255, 0.75),
          0 0 45px rgba(220, 220, 255, 0.65),
          0 0 75px rgba(180, 180, 255, 0.55),
          0 0 110px rgba(140, 140, 255, 0.45);
      }
      50% {
        text-shadow:
          0 0 16px rgba(255, 255, 255, 1),
          0 0 35px rgba(255, 255, 255, 0.95),
          0 0 65px rgba(210, 210, 255, 0.85),
          0 0 100px rgba(170, 170, 255, 0.75),
          0 0 150px rgba(120, 120, 255, 0.6),
          0 0 210px rgba(80, 80, 255, 0.5);
      }
      100% {
        text-shadow:
          0 0 8px rgba(255, 255, 255, 0.85),
          0 0 20px rgba(255, 255, 255, 0.75),
          0 0 45px rgba(220, 220, 255, 0.65),
          0 0 75px rgba(180, 180, 255, 0.55),
          0 0 110px rgba(140, 140, 255, 0.45);
      }
    }

    .fade-text::selection {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      text-shadow: inherit;
    }

    @media (max-width: 600px) {
      .fade-text {
        letter-spacing: 0.02em;
        white-space: normal;
        word-break: keep-all;
      }
    }
  </style>
</head>
<body>
  <div class="glow-wrapper">
    <span class="fade-text">i fade</span>
  </div>
</body>
</html>
